## AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

## Kotlin
kotlin.code.style=official
kotlin.incremental=true

## ---- Performance / RAM (host: 2 vCPU / 7.5 GB) ----
# Daemon ligado: NUNCA rode com --no-daemon (sobe a JVM do zero a cada build).
org.gradle.daemon=true

# 2 núcleos + pouca RAM: parallel estoura a memória (R8 até 4x mais lento). DESLIGADO.
org.gradle.parallel=false

# Um worker por vez = pico de memória mínimo (evita OOM/swap).
org.gradle.workers.max=1

# Desligados por custo/benefício baixo nesta máquina.
org.gradle.caching=false
org.gradle.configuration-cache=false

# Heap contido; o R8 roda dentro do daemon (<=2g faz GC-thrash, exagerar faz swap).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
