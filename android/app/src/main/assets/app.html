body.lv1{--nx-accent:#22C55E;--nx-accent2:#4ADE80;--nx-accent-rgb:34,197,94}
body.lv2{--nx-accent:#EAB308;--nx-accent2:#FACC15;--nx-accent-rgb:234,179,8}
body.lv3{--nx-accent:#EF4444;--nx-accent2:#F87171;--nx-accent-rgb:239,68,68}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 12px 6px;position:relative;overflow:hidden}
.brand{font-size:22px;font-weight:800;letter-spacing:1.5px;color:var(--nx-text);cursor:pointer;-webkit-user-select:none;user-select:none}
.brand span{color:var(--nx-accent)}
.status{display:flex;align-items:center;padding-right:4px}
/* LED realista: corpo maior, luz interna e reflexo especular. */
.dot{
  --led:#5C6675;--glow:transparent;
  position:relative;width:14px;height:14px;border-radius:50%;
  background:var(--led);
  box-shadow:
    inset 0 2px 2px rgba(255,255,255,.42),
    inset 0 -3px 4px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.16),
    0 0 12px var(--glow),
    0 1px 3px rgba(0,0,0,.55);
  transition:background .2s,box-shadow .2s;
}
.dot::after{
  content:"";position:absolute;left:23%;top:14%;width:40%;height:32%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 72%);
  filter:blur(.4px);pointer-events:none;
}
.dot.playing{--led:#3BE27F;--glow:rgba(74,222,128,.75)}
.dot.loading{--led:#F5B94D;--glow:rgba(245,185,77,.50);animation:nxpulse 1s infinite}
.dot.paused{--led:#F5B94D;--glow:rgba(245,185,77,.35)}
.dot.error{--led:#FF5C7A;--glow:rgba(255,92,122,.65)}
@keyframes nxpulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){
  .dot.loading{animation:none}
}

.pcard{
  position:sticky;top:8px;z-index:20;
  background:linear-gradient(180deg,rgba(28,38,54,.94),rgba(20,28,40,.90));
  border:1px solid var(--glass-border);border-radius:18px;
  padding:14px;margin-bottom:18px;
  box-shadow:0 8px 20px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.14);
}
.prow-top{display:flex;gap:12px;align-items:center;min-width:0}
.pthumbwrap{
  width:58px;height:58px;border-radius:12px;overflow:hidden;flex:0 0 auto;
  background:linear-gradient(135deg,#1E2A3E,#31427A);
  display:flex;align-items:center;justify-content:center;
}
.pthumbwrap img{width:100%;height:100%;object-fit:cover}
.pthumbwrap.imgfail img{display:none}
.pmeta{min-width:0;flex:1}
.ptitle{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12.5px;color:var(--nx-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seekrow{display:flex;align-items:center;gap:10px;margin-top:12px}
.t{font-size:11.5px;color:var(--nx-muted);font-variant-numeric:tabular-nums;min-width:38px}
.t.end{text-align:right}
#seek{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:#2A3448;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--nx-accent)}
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px}
.cbtn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);border:1px solid var(--glass-border-soft);color:var(--nx-text);box-shadow:inset 0 1px 0 rgba(255,255,255,.10);transition:transform .1s,background .15s}
.cbtn:active{transform:scale(.92);background:rgba(255,255,255,.16)}
.cbtn.primary{width:56px;height:56px;background:var(--nx-accent);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(var(--nx-accent-rgb),.45)}
.cbtn.primary:active{background:var(--nx-accent2)}
.cbtn svg{display:block}

.sec{margin-bottom:22px}
.searchrow{display:flex;gap:8px}
.qwrap{position:relative;flex:1;min-width:0;display:flex}
#q{flex:1;background:linear-gradient(180deg,rgba(30,41,59,.94),rgba(22,31,45,.92));border:1px solid var(--glass-border);border-radius:12px;padding:12px 40px 12px 13px;color:var(--nx-text);font-size:14px;outline:none;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
#q::placeholder{color:var(--nx-muted)}
#q:focus{border-color:rgba(var(--nx-accent-rgb),.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 2px rgba(var(--nx-accent-rgb),.20),var(--glass-shadow)}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.10);border:1px solid var(--glass-border-soft);color:var(--nx-muted)}
.qclear:active{background:rgba(255,255,255,.18);color:var(--nx-text)}
.qclear.show{display:flex}
.sbtn{background:var(--nx-accent);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;font-size:14px}
.sbtn:active{background:var(--nx-accent2)}
/* Grades de 3 colunas (resultados e fila); novos itens entram no fluxo. */
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.empty{grid-column:1/-1;font-size:12.5px;color:var(--nx-muted);padding:10px 4px}

.th{position:relative;width:100%;height:auto;aspect-ratio:1;border-radius:0;overflow:hidden;background:linear-gradient(135deg,#1E2A3E,#31427A);display:flex;align-items:center;justify-content:center}
.dur{position:absolute;top:5px;right:5px;z-index:2;display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:6px;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.14);color:var(--nx-text);font-size:9px;line-height:1;font-variant-numeric:tabular-nums}
.dur svg{display:block;opacity:.85}
.th img{width:100%;height:100%;object-fit:cover}
.th.imgfail img{display:none}

.card,.prow{
  position:relative;overflow:hidden;display:block;min-width:0;
  background:linear-gradient(160deg,rgba(30,41,59,.62),rgba(18,26,38,.50));border:1px solid var(--glass-border-soft);border-radius:12px;
  padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.10);
  -webkit-user-select:none;user-select:none;transition:transform .1s;
  content-visibility:auto;contain-intrinsic-size:auto 150px;
}
.card:active,.prow:active{transform:scale(.985)}
.prow.cur{border-color:rgba(var(--nx-accent-rgb),.72);background:linear-gradient(160deg,rgba(var(--nx-accent-rgb),.30),rgba(255,255,255,.06) 46%,rgba(18,26,38,.60));box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 0 0 1px rgba(var(--nx-accent-rgb),.20)}
.prow .num{position:absolute;top:8px;left:8px;z-index:2;width:18px;height:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9.5px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);color:var(--nx-text);font-variant-numeric:tabular-nums}
.prow.cur .num{color:var(--nx-accent2)}
/* Título e subtítulo sobrepostos na própria foto. */
.info{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:16px 6px 6px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.86) 45%)}
.tt{font-size:11px;font-weight:600;line-height:1.2;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ss{font-size:9.5px;color:rgba(232,237,245,.78);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Popup do card (bottom sheet). */
.pop{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;padding:16px 14px calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,.72)}
.pop.show{display:flex}
.pop-card{position:relative;width:100%;max-width:430px;border-radius:18px;padding:14px;background:linear-gradient(180deg,var(--glass-hi),var(--glass-bg) 40%,rgba(18,26,38,.94));border:1px solid var(--glass-border);box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14);animation:popIn .18s ease-out}
@keyframes popIn{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.pop-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.10);border:1px solid var(--glass-border-soft);display:flex;align-items:center;justify-content:center;color:var(--nx-muted)}
.pop-head{display:flex;gap:10px;align-items:center;padding-right:34px}
.pop-thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;flex:0 0 auto;background:linear-gradient(135deg,#1E2A3E,#31427A)}
.pop-thumb img{width:100%;height:100%;object-fit:cover}
.pop-meta{min-width:0;flex:1}
.pop-title{font-size:14.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pop-sub{font-size:12px;color:var(--nx-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pop-btn{padding:11px 10px;border-radius:12px;background:rgba(255,255,255,.09);border:1px solid var(--glass-border-soft);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.pop-btn:active{background:rgba(255,255,255,.17)}
.pop-btn.primary{background:var(--nx-accent);border-color:transparent;color:#fff}
.pop-btn.danger{background:rgba(255,92,122,.16);border-color:rgba(255,92,122,.30);color:#FFD7DE}
.pop-btn.wide{grid-column:1/-1}

.foot{width:100%;text-align:center;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(232,237,245,.45);padding:18px 0 6px;-webkit-user-select:none;user-select:none}

.toasts{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{background:#1E293B;border:1px solid #2C3A52;color:var(--nx-text);font-size:12.5px;padding:9px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.45);max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .25s}
.toast.err{border-color:rgba(255,92,122,.5);color:#FFD7DE}
</style>
</head>
<body>

<header class="top">
  <div class="brand">NEX<span>YOU</span></div>
  <div class="status"><span class="dot" id="dot" role="status"></span></div>
</header>

<section class="pcard">
  <div class="prow-top">
    <div class="pthumbwrap" id="pThumbWrap"></div>
    <div class="pmeta">
      <div class="ptitle" id="pTitle">Nada tocando</div>
      <div class="psub" id="pSub">Escolha uma música para começar</div>
    </div>
  </div>
  <div class="seekrow">
    <span class="t" id="posText">0:00</span>
    <input type="range" id="seek" min="0" max="1000" step="1" value="0">
    <span class="t end" id="durText">0:00</span>
  </div>
  <div class="controls">
    <button class="cbtn" id="btnPrev" aria-label="Anterior"></button>
    <button class="cbtn primary" id="btnToggle" aria-label="Reproduzir ou pausar"></button>
    <button class="cbtn" id="btnNext" aria-label="Próxima"></button>
  </div>
</section>

<section class="sec">
  <div class="searchrow">
    <div class="qwrap">
      <input id="q" type="text" placeholder="Música, artista ou link do YouTube" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button id="btnClearQ" class="qclear" aria-label="Limpar busca"></button>
    </div>
    <button id="btnSearch" class="sbtn">Buscar</button>
  </div>
  <div id="results" class="list"></div>
</section>

<section class="sec">
  <div id="playlist" class="list"></div>
</section>

<footer class="foot">OPENCODE BY LEO</footer>

<div id="pop" class="pop" aria-hidden="true">
  <div class="pop-card" role="dialog" aria-modal="true">
    <button class="pop-x" id="popClose" aria-label="Fechar"></button>
    <div class="pop-head">
      <div class="pop-thumb" id="popThumb"></div>
      <div class="pop-meta">
        <div class="pop-title" id="popTitle"></div>
        <div class="pop-sub" id="popSub"></div>
      </div>
    </div>
    <div class="pop-acts" id="popActs"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script>
(function(){
'use strict';

var ICONS = {
  play: 'M8 5v14l11-7z',
  pause: 'M6 19h4V5H6v14zm8-14v14h4V5h-4z',
  prev: 'M6 6h2v12H6zm3.5 6l8.5 6V6z',
  next: 'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',
  plus: 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z',
  up: 'M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z',
  down: 'M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z',
  x: 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z',
  clock: 'M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'
};

var STATE_LABEL = { stopped:'parado', loading:'carregando…', playing:'reproduzindo', paused:'pausado', error:'erro' };

var P = { state:'stopped', pos:0, dur:0, index:-1, id:null, title:null, uploader:null, fmt:null, error:null };
var L = { current:-1, items:[] };
var reqSeq = 0;
var dragging = false;
var lastErrShown = null;
var boostLevel = 0;


function $(id){ return document.getElementById(id); }

function api(name){
  try{
    if(window.NexusAndroid && window.NexusAndroid[name]){
      var args = Array.prototype.slice.call(arguments, 1);
      return window.NexusAndroid[name].apply(window.NexusAndroid, args);
    }
  }catch(e){}
  return null;
}

var BOOST_NAMES = ['Booster I', 'Booster II', 'Booster III'];

function applyBoostTheme(){
  document.body.className = boostLevel > 0 ? ('lv' + boostLevel) : '';
}

function cycleBoost(){
  boostLevel = (boostLevel + 1) % 4;
  applyBoostTheme();
  api('setBoost', boostLevel);
  if(boostLevel > 0) toast(BOOST_NAMES[boostLevel - 1] + ' ativado');
  else toast('Booster desligado');
}

function fmt(sec){
  var n = Number(sec);
  if(!isFinite(n) || n < 0) n = 0;
  n = Math.floor(n);
  var h = Math.floor(n/3600), m = Math.floor((n%3600)/60), s = n%60;
  var out = (m<10 && h>0 ? '0'+m : ''+m) + ':' + (s<10 ? '0'+s : ''+s);
  return h>0 ? h+':'+out : out;
}

function toast(msg, isErr, ms){
  var box = $('toasts');
  if(!box) return;
  var el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 300);
  }, ms || 2600);
}

function svgIcon(name, size){
  var ns = 'http://www.w3.org/2000/svg';
  var s = document.createElementNS(ns, 'svg');
  s.setAttribute('width', size);
  s.setAttribute('height', size);
  s.setAttribute('viewBox', '0 0 24 24');
  var p = document.createElementNS(ns, 'path');
  p.setAttribute('d', ICONS[name]);
  p.setAttribute('fill', 'currentColor');
  s.appendChild(p);
  return s;
}

function thumbUrl(t){
  if(t.thumb) return t.thumb;
  if(t.id) return 'https://i.ytimg.com/vi/' + t.id + '/mqdefault.jpg';
  return '';
}

/** Capa com o relógio (duração) dentro do card, no canto da imagem. */
function makeCover(t){
  var th = makeThumb(thumbUrl(t));
  if(t.dur > 0){
    var d = document.createElement('span');
    d.className = 'dur';
    d.appendChild(svgIcon('clock', 9));
    var s = document.createElement('span');
    s.textContent = fmt(t.dur);
    d.appendChild(s);
    th.appendChild(d);
  }
  return th;
}

function makeThumb(url){
  var w = document.createElement('div');
  w.className = 'th';
  if(url){
    var img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.onerror = function(){ w.className = 'th imgfail'; };
    w.appendChild(img);
  }
  return w;
}

function setPlayerThumb(url){
  var w = $('pThumbWrap');
  if(!w) return;
  var cur = w.getElementsByTagName('img')[0];
  if(url && cur && cur.getAttribute('src') === url) return;
  w.className = 'pthumbwrap';
  w.innerHTML = '';
  if(url){
    var img = document.createElement('img');
    img.src = url;
    img.alt = '';
    img.onerror = function(){ w.className = 'pthumbwrap imgfail'; };
    w.appendChild(img);
  }
}

function renderPlayer(){
  var st = P.state || 'stopped';
  var dot = $('dot');
  dot.className = 'dot' + (st !== 'stopped' ? ' ' + st : '');
  dot.setAttribute('aria-label', STATE_LABEL[st] || st);
  $('pTitle').textContent = P.title ? P.title : 'Nada tocando';
  var sub = P.uploader ? P.uploader : (st === 'stopped' ? 'Escolha uma música para começar' : '');
  if(P.fmt) sub += (sub ? ' · ' : '') + P.fmt;
  $('pSub').textContent = sub;
  setPlayerThumb(P.id ? 'https://i.ytimg.com/vi/' + P.id + '/mqdefault.jpg' : '');
  var tb = $('btnToggle');
  tb.innerHTML = '';
  var active = (st === 'playing' || st === 'loading');
  tb.appendChild(svgIcon(active ? 'pause' : 'play', active ? 26 : 28));
  if(!dragging){
    $('seek').value = String(P.dur > 0 ? Math.round((P.pos / P.dur) * 1000) : 0);
    $('posText').textContent = fmt(P.pos);
  }
  $('durText').textContent = fmt(P.dur);
  if(st === 'playing') lastErrShown = null;
  if(st === 'error' && P.error && P.error !== lastErrShown){
    lastErrShown = P.error;
    toast(P.error, true, /Aguarde/i.test(P.error) ? 6000 : 0);
  }
}

function renderPlaylist(){
  var box = $('playlist');
  box.innerHTML = '';
  if(!L.items.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Fila vazia — toque num resultado e use Adicionar à fila.';
    box.appendChild(e);
    return;
  }
  for(var i = 0; i < L.items.length; i++){
    box.appendChild(playlistRow(L.items[i], i, i === L.current));
  }
}

function trackInfo(t){
  var info = document.createElement('div');
  info.className = 'info';
  var tt = document.createElement('div');
  tt.className = 'tt';
  tt.textContent = t.title ? t.title : 'Sem título';
  var ss = document.createElement('div');
  ss.className = 'ss';
  ss.textContent = t.uploader ? t.uploader : '';
  info.appendChild(tt);
  info.appendChild(ss);
  return info;
}

/* Popup do card: ações do item (resultado de busca ou item da fila). */
function popBtn(icon, label, cls, fn){
  var b = document.createElement('button');
  b.className = 'pop-btn' + (cls ? ' ' + cls : '');
  b.appendChild(svgIcon(icon, 16));
  var s = document.createElement('span');
  s.textContent = label;
  b.appendChild(s);
  b.addEventListener('click', fn);
  return b;
}

function addResultToQueue(t){
  var idx = api('addToPlaylist', t.url, t.id, t.title, t.uploader, t.dur || 0, t.thumb || '');
  if(typeof idx === 'number' && idx >= 0) toast('Adicionada à fila (' + (idx + 1) + ')');
  else toast('Não foi possível adicionar');
}

function openPopup(ctx){
  var t = ctx.item;
  $('popTitle').textContent = t.title ? t.title : 'Sem título';
  var sub = t.uploader ? t.uploader : '';
  if(t.dur > 0) sub += (sub ? ' · ' : '') + fmt(t.dur);
  $('popSub').textContent = sub;
  var tw = $('popThumb');
  tw.innerHTML = '';
  var u = thumbUrl(t);
  if(u){
    var img = document.createElement('img');
    img.src = u;
    img.alt = '';
    img.decoding = 'async';
    img.onerror = function(){ tw.innerHTML = ''; };
    tw.appendChild(img);
  }
  var acts = $('popActs');
  acts.innerHTML = '';
  if(ctx.kind === 'result'){
    acts.appendChild(popBtn('play', 'Tocar', 'primary wide', function(){
      closePopup();
      api('playItem', t.url, t.id, t.title, t.uploader, t.dur || 0, t.thumb || '');
    }));
    acts.appendChild(popBtn('plus', 'Adicionar à fila', 'wide', function(){
      closePopup();
      addResultToQueue(t);
    }));
  } else {
    var i = ctx.index;
    acts.appendChild(popBtn('play', 'Tocar agora', 'primary wide', function(){
      closePopup();
      api('playIndex', i);
    }));
    acts.appendChild(popBtn('up', 'Subir', '', function(){
      closePopup();
      if(i > 0) api('moveInPlaylist', i, 0);
    }));
    acts.appendChild(popBtn('down', 'Descer', '', function(){
      closePopup();
      if(i < L.items.length - 1) api('moveInPlaylist', i, L.items.length - 1);
    }));
    acts.appendChild(popBtn('x', 'Remover', 'danger wide', function(){
      closePopup();
      api('removeFromPlaylist', i);
    }));
  }
  $('pop').classList.add('show');
  $('pop').setAttribute('aria-hidden', 'false');
}

function closePopup(){
  $('pop').classList.remove('show');
  $('pop').setAttribute('aria-hidden', 'true');
}

function playlistRow(t, i, cur){
  var row = document.createElement('div');
  row.className = 'prow' + (cur ? ' cur' : '');
  var num = document.createElement('div');
  num.className = 'num';
  num.textContent = String(i + 1);
  row.appendChild(num);
  row.appendChild(makeCover(t));
  row.appendChild(trackInfo(t));
  row.addEventListener('click', function(){ openPopup({ kind:'queue', index:i, item:t }); });
  return row;
}

function resultCard(t){
  var card = document.createElement('div');
  card.className = 'card';
  card.appendChild(makeCover(t));
  card.appendChild(trackInfo(t));
  card.addEventListener('click', function(){ openPopup({ kind:'result', item:t }); });
  return card;
}

function resultsHaveCards(){
  var box = $('results');
  return !!(box && box.querySelector('.card'));
}

function updateClearBtn(){
  var q = $('q');
  var btn = $('btnClearQ');
  if(!btn) return;
  var v = q ? q.value : '';
  v = v ? v.replace(/^\s+|\s+$/g, '') : '';
  if(v || resultsHaveCards()) btn.classList.add('show');
  else btn.classList.remove('show');
}

function renderResults(d){
  var box = $('results');
  box.innerHTML = '';
  var items = d.items || [];
  if(!items.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Nada encontrado.';
    box.appendChild(e);
  } else {
    for(var i = 0; i < items.length; i++){
      box.appendChild(resultCard(items[i]));
    }
  }
  updateClearBtn();
}

function clearResults(msg){
  var box = $('results');
  box.innerHTML = '';
  if(msg){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = msg;
    box.appendChild(e);
  }
  updateClearBtn();
}

function doSearch(){
  var q = $('q').value;
  q = q ? q.replace(/^\s+|\s+$/g, '') : '';
  if(!q) return;
  reqSeq++;
  clearResults('Buscando…');
  api('search', q, reqSeq);
}

function initControls(){
  $('btnPrev').appendChild(svgIcon('prev', 24));
  $('btnNext').appendChild(svgIcon('next', 24));
  $('btnToggle').appendChild(svgIcon('play', 28));

  $('btnPrev').addEventListener('click', function(){ api('prev'); });
  $('btnNext').addEventListener('click', function(){ api('next'); });
  $('btnToggle').addEventListener('click', function(){ api('toggle'); });

  var seek = $('seek');
  seek.addEventListener('input', function(){
    dragging = true;
    if(P.dur > 0) $('posText').textContent = fmt((seek.value / 1000) * P.dur);
  });
  seek.addEventListener('change', function(){
    dragging = false;
    if(P.dur > 0) api('seekTo', (seek.value / 1000) * P.dur);
  });

  $('btnSearch').addEventListener('click', doSearch);
  $('q').addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.keyCode === 13) doSearch();
  });
  $('q').addEventListener('input', updateClearBtn);

  var btnClearQ = $('btnClearQ');
  btnClearQ.appendChild(svgIcon('x', 16));
  btnClearQ.addEventListener('click', function(){
    reqSeq++;
    $('q').value = '';
    clearResults();
    $('q').focus();
  });

  $('popClose').appendChild(svgIcon('x', 16));
  $('popClose').addEventListener('click', closePopup);
  $('pop').addEventListener('click', function(e){ if(e.target === this) closePopup(); });

  var brand = document.querySelector('.brand');
  if(brand) brand.addEventListener('click', cycleBoost);
}

window.__nexus = {
  handle: function(name, jsonStr){
    var d;
    try{ d = JSON.parse(jsonStr); }catch(e){ return; }
    if(name === 'player'){
      P.state = d.state ? d.state : 'stopped';
      if(typeof d.pos === 'number') P.pos = d.pos;
      if(typeof d.dur === 'number') P.dur = d.dur;
      if(typeof d.index === 'number') P.index = d.index;
      P.id = d.id ? d.id : null;
      P.title = d.title ? d.title : null;
      P.uploader = d.uploader ? d.uploader : null;
      P.fmt = d.fmt ? d.fmt : null;
      P.error = d.error ? d.error : null;
      renderPlayer();
    } else if(name === 'playlist'){
      L.current = (typeof d.current === 'number') ? d.current : -1;
      L.items = d.items ? d.items : [];
      renderPlaylist();
      api('warmQueue');
    } else if(name === 'search'){
      if(typeof d.reqId === 'number' && d.reqId !== reqSeq) return;
      if(d.ok && d.items) renderResults(d);
      else clearResults(d.error ? ('Erro: ' + d.error) : 'Erro na busca.');
    }
  }
};

initControls();
renderPlayer();
renderPlaylist();
clearResults();
api('getState');
api('warmQueue');

var b0 = api('getBoost');
if(typeof b0 === 'number') boostLevel = Math.min(3, Math.max(0, Math.floor(b0)));
applyBoostTheme();

})();
</script>
</body>
</html>
